<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>CV Timelapse GIF</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Generate an animated GIF of every version of the CV, with adjustable FPS." />
  <style>
    :root {
      --bg: #0b0c10;
      --fg: #e7eaf0;
      --muted: #a9b1c6;
      --card: #121724;
      --border: #232a38;
      --accent: #7aa2ff;
      --bad: #ff8c8c;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--bg); color: var(--fg);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji","Segoe UI Emoji";
    }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }

    header {
      position: sticky; top: 0; z-index: 5;
      background: linear-gradient(180deg, rgba(11,12,16,.98), rgba(11,12,16,.92));
      backdrop-filter: saturate(1.1) blur(6px);
      border-bottom: 1px solid var(--border);
      padding: 10px 16px;
      display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap;
    }
    .title { font-weight: 600; letter-spacing: .2px; }
    .nav { font-size: 13px; display: flex; gap: 14px; }

    main { max-width: 1100px; margin: 16px auto 80px; padding: 0 16px; display: grid; gap: 16px; }
    @media (min-width: 900px) { main { grid-template-columns: 340px 1fr; align-items: start; } }

    .card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 14px; }
    .card h2 { font-size: 14px; margin: 0 0 12px; color: var(--muted); font-weight: 600; letter-spacing: .3px; text-transform: uppercase; }

    .field { display: grid; gap: 6px; margin-bottom: 14px; }
    .field label, .check { font-size: 13px; color: var(--muted); }
    .field input[type="range"] { width: 100%; accent-color: var(--accent); }
    .field select {
      width: 100%; padding: 7px 10px; border-radius: 10px; border: 1px solid var(--border);
      background: #0f1423; color: var(--fg); font: inherit; font-size: 14px;
    }
    .fps-row { display: flex; justify-content: space-between; align-items: baseline; }
    .fps-val { font-size: 22px; font-weight: 600; }
    .hint { font-size: 12px; color: var(--muted); }
    .check { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; cursor: pointer; }
    .check input { accent-color: var(--accent); }

    .btn {
      padding: 9px 14px; border: 1px solid var(--border); border-radius: 10px;
      background: #0f1423; color: var(--fg); cursor: pointer; font: inherit; font-size: 14px;
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    }
    .btn.primary { background: var(--accent); border-color: var(--accent); color: #0b0c10; font-weight: 600; }
    .btn[disabled], .btn[aria-disabled="true"] { opacity: .5; cursor: not-allowed; pointer-events: none; }
    .buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 6px; }

    .progress { height: 8px; border: 1px solid var(--border); border-radius: 8px; background: #0e1220; overflow: hidden; margin-top: 14px; }
    .bar { height: 100%; width: 0%; background: var(--accent); transition: width .15s linear; }
    #status { margin-top: 8px; font-size: 13px; color: var(--muted); min-height: 1.3em; }

    .preview-wrap { display: grid; place-items: center; min-height: 420px; }
    .preview-wrap img { max-width: 100%; max-height: 80vh; border: 1px solid var(--border); border-radius: 10px; background: #fff; display: none; }
    .placeholder { color: var(--muted); font-size: 14px; text-align: center; padding: 24px; }
    .meta { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; justify-content: center; }
    .pill { font-size: 12px; color: var(--muted); background: #0f1423; border: 1px solid var(--border); padding: 5px 10px; border-radius: 999px; }

    #errors { display: grid; gap: 8px; }
    .error { color: var(--bad); font-size: 13px; border: 1px solid #6e2326; background: #270d10; border-radius: 10px; padding: 10px 12px; }
  </style>
</head>
<body>
  <header>
    <div class="title">CV Timelapse GIF</div>
    <nav class="nav">
      <a href="../">Version viewer</a>
      <a href="../simulateTimelapse.html">Live timelapse</a>
    </nav>
  </header>

  <main>
    <section class="card" aria-labelledby="settings-title">
      <h2 id="settings-title">Settings</h2>

      <div class="field">
        <div class="fps-row">
          <label for="fps">Speed (FPS)</label>
          <span class="fps-val" id="fpsVal">2 fps</span>
        </div>
        <input id="fps" type="range" min="0.5" max="20" step="0.5" value="2" />
        <span class="hint" id="fpsHint">500 ms per frame</span>
      </div>

      <div class="field">
        <label for="width">GIF width</label>
        <select id="width">
          <option value="480">480 px (smallest file)</option>
          <option value="600" selected>600 px</option>
          <option value="800">800 px</option>
          <option value="1000">1000 px (sharpest, largest file)</option>
        </select>
      </div>

      <div class="field">
        <label for="order">Frame order</label>
        <select id="order">
          <option value="date" selected>By commit date (all branches merged)</option>
          <option value="branch">By branch (oldest branch first)</option>
        </select>
      </div>

      <div class="field">
        <label for="hold">Hold last frame</label>
        <select id="hold">
          <option value="0">No extra hold</option>
          <option value="1000" selected>+1 second</option>
          <option value="2000">+2 seconds</option>
          <option value="3000">+3 seconds</option>
        </select>
      </div>

      <label class="check"><input type="checkbox" id="label" checked /> Show date, branch and commit under each frame</label>
      <label class="check"><input type="checkbox" id="loop" checked /> Loop forever</label>

      <div class="buttons">
        <button id="generateBtn" class="btn primary" type="button" disabled>Loading…</button>
        <a id="downloadBtn" class="btn" aria-disabled="true" download="cv-timelapse.gif">Download GIF</a>
      </div>

      <div class="progress" aria-hidden="true"><div id="progressBar" class="bar"></div></div>
      <div id="status" role="status" aria-live="polite">Collecting CV versions…</div>
    </section>

    <section class="card" aria-labelledby="preview-title">
      <h2 id="preview-title">Preview</h2>
      <div class="preview-wrap">
        <img id="preview" alt="Animated GIF of the CV changing over time" />
        <div class="placeholder" id="placeholder">Your GIF will appear here after you click <b>Generate GIF</b>.</div>
      </div>
      <div class="meta" id="meta"></div>
    </section>

    <section id="errors" aria-live="polite"></section>
  </main>

  <!-- PDF.js (v3, same build as the other pages), pinned with SRI -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"
          integrity="sha512-q+4liFwdPC/bNdhUpZx6aXDx/h77yEQtn4I1slHydcbZK34nLaR3cAeYSJshoxIOq3mjEf7xJE8YWIUHMn+oCQ=="
          crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script type="module">
    import { GIFEncoder, quantize, applyPalette } from './gifenc.esm.js';

    // ====== Repo config (same as the other pages) ======
    const GITHUB_REPO_OWNER = 'renanbazinin';
    const GITHUB_REPO_NAME  = 'CV-RENAN';
    const FILE_PATH         = 'CV-RenanBazinin.pdf';
    const DEFAULT_BRANCH    = 'main';
    const API               = `https://api.github.com/repos/${GITHUB_REPO_OWNER}/${GITHUB_REPO_NAME}`;
    const CONCURRENCY       = 3;              // parallel PDF renders
    const PAGE_ASPECT       = Math.SQRT2;     // A4 portrait; every frame gets the same size
    const CACHE_KEY         = `cv-gif-versions-v2:${GITHUB_REPO_OWNER}/${GITHUB_REPO_NAME}`;
    const CACHE_TTL_MS      = 10 * 60 * 1000; // reuse the version list for 10 min (GitHub API rate limit)

    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    // ====== DOM ======
    const $ = (id) => document.getElementById(id);
    const fpsInput = $('fps'), fpsVal = $('fpsVal'), fpsHint = $('fpsHint');
    const widthSel = $('width'), orderSel = $('order'), holdSel = $('hold');
    const labelChk = $('label'), loopChk = $('loop');
    const generateBtn = $('generateBtn'), downloadBtn = $('downloadBtn');
    const progressBar = $('progressBar'), statusEl = $('status');
    const previewImg = $('preview'), placeholder = $('placeholder'), metaEl = $('meta'), errorsEl = $('errors');

    // ====== State ======
    const state = {
      versions: [],          // [{ branch, sha, msg, date }] — commits that changed the PDF
      loadError: false,
      pdfCache: new Map(),   // sha -> Promise<{ bytes, hash } | { error }>; failures are not kept
      frames: null,          // quantized frames for the render settings in framesKey
      framesKey: '',
      incomplete: false,     // some downloads failed in a retryable way; the next Generate retries them
      gifParams: null,       // timing the current preview was encoded with
      failedParams: null,    // timing whose encode just failed (not retried automatically)
      gifUrl: null,
      busy: false,
    };

    // ====== GitHub helpers (token handling matches the other pages) ======
    let githubTokenCache;
    async function ensureGithubToken() {
      if (githubTokenCache !== undefined) return githubTokenCache;
      githubTokenCache = null;
      try {
        const stored = window.localStorage?.getItem('GITHUB_TOKEN');
        if (stored && stored.trim()) githubTokenCache = stored.trim();
      } catch { /* storage blocked */ }
      if (!githubTokenCache) {
        try {
          const res = await fetch('../.env', { cache: 'no-store' });
          if (res.ok) {
            const m = (await res.text()).match(/^\s*GITHUB_TOKEN\s*=\s*(.+)\s*$/m);
            const value = m && m[1].trim().replace(/^['"]|['"]$/g, '');
            if (value) githubTokenCache = value;
          }
        } catch { /* no local .env */ }
      }
      return githubTokenCache;
    }

    async function githubJson(url) {
      const headers = new Headers({ Accept: 'application/vnd.github+json' });
      const token = await ensureGithubToken();
      if (token) headers.set('Authorization', `Bearer ${token}`);
      let res = await fetch(url, { headers });
      if (res.status === 401 && token) {
        // Expired or wrong token. The repo is public, so carry on without it.
        githubTokenCache = null;
        headers.delete('Authorization');
        showError('Your saved GITHUB_TOKEN was rejected, so the page continues without it.');
        res = await fetch(url, { headers });
      }
      if (res.status === 403 || res.status === 429) {
        const retryAfter = Number(res.headers.get('retry-after'));
        if (res.status === 429 || retryAfter || res.headers.get('x-ratelimit-remaining') === '0') {
          const resetMs = retryAfter ? Date.now() + retryAfter * 1000 : Number(res.headers.get('x-ratelimit-reset')) * 1000;
          const when = resetMs ? new Date(resetMs).toLocaleTimeString() : 'a few minutes';
          throw new Error(`GitHub API rate limit reached${githubTokenCache ? '' : ' (60 requests per hour without a token)'}. Try again after ${when}.`);
        }
      }
      if (!res.ok) throw new Error(`GitHub API HTTP ${res.status} for ${url}`);
      const next = (res.headers.get('Link') || '').match(/<([^>]+)>;\s*rel="next"/);
      return { data: await res.json(), next: next ? next[1] : null };
    }

    async function githubAll(url, maxPages = 20) {
      const out = [];
      for (let page = 0; url && page < maxPages; page++) {
        const { data, next } = await githubJson(url);
        out.push(...data);
        url = next;
      }
      return out;
    }

    const commitTime = (c) => new Date(c.commit?.committer?.date || c.commit?.author?.date || 0).getTime();

    // Commits on the default branch's own line (not ones it only got through a merge). If the walk
    // runs past the fetched history, everything older than that window also counts as its own.
    async function firstParentChain(branch) {
      const commits = await githubAll(`${API}/commits?sha=${encodeURIComponent(branch)}&per_page=100`, 10);
      const parent = new Map(commits.map((c) => [c.sha, c.parents?.[0]?.sha]));
      const chain = new Set();
      let sha = commits[0]?.sha;
      for (; sha && parent.has(sha) && !chain.has(sha); sha = parent.get(sha)) chain.add(sha);
      const truncated = !!sha && !parent.has(sha);
      return { chain, before: truncated ? commitTime(commits[commits.length - 1]) : 0 };
    }

    // A commit appears on every branch that contains it. Label it with the branch it was made on:
    // the default branch for its own line, otherwise the smallest branch that has it (a branch that
    // merged others has a longer history, so the original branch keeps its name).
    function assignBranches(lists, mainLine) {
      const bySha = new Map();
      const add = (branch, c) => {
        if (bySha.has(c.sha)) return;
        bySha.set(c.sha, {
          branch,
          sha: c.sha,
          msg: (c.commit?.message || '').split('\n')[0],
          date: c.commit?.committer?.date || c.commit?.author?.date || null,
        });
      };
      const onMainLine = (c) => mainLine.chain.has(c.sha) || (mainLine.before > 0 && commitTime(c) < mainLine.before);
      for (const { name, commits } of lists) {
        if (name === DEFAULT_BRANCH) commits.filter(onMainLine).forEach((c) => add(name, c));
      }
      const bySize = lists.slice().sort((a, b) => a.commits.length - b.commits.length || a.name.localeCompare(b.name));
      for (const { name, commits } of bySize) commits.forEach((c) => add(name, c));
      return [...bySha.values()];
    }

    function readCache() {
      try { return JSON.parse(localStorage.getItem(CACHE_KEY) || 'null'); } catch { return null; }
    }

    async function loadVersions() {
      const cached = readCache();
      if (cached?.versions?.length && Date.now() - cached.at < CACHE_TTL_MS) return cached.versions;
      try {
        const branches = await githubAll(`${API}/branches?per_page=100`);
        const lists = [];
        for (const b of branches) {
          lists.push({
            name: b.name,
            commits: await githubAll(`${API}/commits?sha=${encodeURIComponent(b.name)}&path=${encodeURIComponent(FILE_PATH)}&per_page=100`),
          });
        }
        const mainLine = branches.some((b) => b.name === DEFAULT_BRANCH)
          ? await firstParentChain(DEFAULT_BRANCH) : { chain: new Set(), before: 0 };
        const versions = assignBranches(lists, mainLine);
        try { localStorage.setItem(CACHE_KEY, JSON.stringify({ at: Date.now(), versions })); } catch { /* quota */ }
        return versions;
      } catch (e) {
        // PDFs come from raw.githubusercontent.com (no API limit), so an older list still works.
        if (cached?.versions?.length) {
          showError(`${e.message} Using the CV list saved on ${new Date(cached.at).toLocaleString()}.`);
          return cached.versions;
        }
        throw e;
      }
    }

    function orderedVersions(order) {
      const time = (v) => (v.date ? new Date(v.date).getTime() : 0);
      const list = state.versions.slice();
      if (order === 'branch') {
        // Branches oldest-first by their newest PDF change; commits oldest-first within each branch.
        const newest = new Map();
        for (const v of list) newest.set(v.branch, Math.max(newest.get(v.branch) || 0, time(v)));
        list.sort((a, b) => (newest.get(a.branch) - newest.get(b.branch)) || a.branch.localeCompare(b.branch) || (time(a) - time(b)));
      } else {
        list.sort((a, b) => time(a) - time(b));
      }
      return list;
    }

    // ====== PDF download (successes cached, failures retried next time) ======
    function getPdf(sha) {
      let pending = state.pdfCache.get(sha);
      if (!pending) {
        const url = `https://raw.githubusercontent.com/${GITHUB_REPO_OWNER}/${GITHUB_REPO_NAME}/${sha}/${FILE_PATH}`;
        pending = (async () => {
          try {
            const res = await fetch(url);
            // A 404 will never change (the PDF isn't in that commit); other failures are worth retrying.
            if (res.status === 404) return { error: 'PDF not found in this commit', permanent: true };
            if (!res.ok) return { error: `download failed (HTTP ${res.status})` };
            const bytes = await res.arrayBuffer();
            let hash = null;
            if (crypto?.subtle) {
              const digest = await crypto.subtle.digest('SHA-256', bytes);
              hash = Array.from(new Uint8Array(digest), (x) => x.toString(16).padStart(2, '0')).join('');
            }
            return { bytes, hash };
          } catch (e) {
            return { error: `download failed (${e.message || e})` };
          }
        })();
        state.pdfCache.set(sha, pending);
        pending.then((r) => { if (r.error && !r.permanent) state.pdfCache.delete(sha); });
      }
      return pending;
    }

    // ====== Render one version to a fixed-size, quantized frame ======
    function frameSize(width, withLabel) {
      const pageH = Math.round(width * PAGE_ASPECT);
      const labelH = withLabel ? Math.max(28, Math.round(width * 0.055)) : 0;
      return { pageH, labelH, height: pageH + labelH };
    }

    function fitText(ctx, text, maxWidth) {
      if (ctx.measureText(text).width <= maxWidth) return text;
      let lo = 0, hi = text.length;
      while (lo < hi) {
        const mid = (lo + hi + 1) >> 1;
        if (ctx.measureText(text.slice(0, mid) + '…').width <= maxWidth) lo = mid; else hi = mid - 1;
      }
      return text.slice(0, lo) + '…';
    }

    async function renderFrame(version, bytes, width, withLabel) {
      const { pageH, labelH, height } = frameSize(width, withLabel);
      const canvas = document.createElement('canvas');
      const off = document.createElement('canvas');
      try {
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, width, pageH);

        // PDF.js takes ownership of the buffer, so hand it a copy and keep the cache intact.
        // isEvalSupported: false closes CVE-2024-4367 (font code run through eval).
        const pdf = await pdfjsLib.getDocument({ data: new Uint8Array(bytes.slice(0)), isEvalSupported: false }).promise;
        try {
          const page = await pdf.getPage(1);
          const base = page.getViewport({ scale: 1 });
          const scale = Math.min(width / base.width, pageH / base.height);
          const viewport = page.getViewport({ scale });
          off.width = Math.round(viewport.width);
          off.height = Math.round(viewport.height);
          const offCtx = off.getContext('2d');
          offCtx.fillStyle = '#ffffff';
          offCtx.fillRect(0, 0, off.width, off.height);
          await page.render({ canvasContext: offCtx, viewport }).promise;
          ctx.drawImage(off, Math.round((width - off.width) / 2), Math.round((pageH - off.height) / 2));
        } finally {
          await pdf.destroy();
        }

        if (withLabel) {
          ctx.fillStyle = '#0b0c10';
          ctx.fillRect(0, pageH, width, labelH);
          const pad = Math.round(labelH * 0.45);
          const fontPx = Math.round(labelH * 0.42);
          ctx.font = `600 ${fontPx}px system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif`;
          ctx.textBaseline = 'middle';
          const y = pageH + labelH / 2;
          const date = version.date ? version.date.slice(0, 10) : '';
          ctx.fillStyle = '#7aa2ff';
          ctx.fillText(date, pad, y);
          const x = pad + ctx.measureText(date).width + pad * 0.8;
          ctx.font = `400 ${fontPx}px system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif`;
          ctx.fillStyle = '#e7eaf0';
          ctx.fillText(fitText(ctx, `${version.branch} · ${version.msg || version.sha.slice(0, 7)}`, width - x - pad), x, y);
        }

        const { data } = ctx.getImageData(0, 0, width, height);
        const palette = quantize(data, 256);
        const index = applyPalette(data, palette);
        return { index, palette, width, height, version };
      } finally {
        // Free the backing stores now; iOS Safari caps total canvas memory.
        off.width = off.height = 0;
        canvas.width = canvas.height = 0;
      }
    }

    // ====== Build all frames for one set of render settings ======
    async function buildFrames({ width, order, label }) {
      const list = orderedVersions(order);
      setProgress(0, `Downloading ${list.length} CV versions…`);

      // Download all PDFs first, so identical files can be dropped before rendering.
      const pdfs = await Promise.all(list.map((v) => getPdf(v.sha)));
      let retryable = 0;   // failures that may succeed later (network, 5xx); 404s and broken PDFs won't
      const keep = [];
      let lastHash = null;
      list.forEach((v, i) => {
        const pdf = pdfs[i];
        if (pdf.error) {
          if (!pdf.permanent) retryable++;
          showError(`Skipped ${v.branch} @ ${v.sha.slice(0, 7)}: ${pdf.error}`);
          return;
        }
        if (pdf.hash && pdf.hash === lastHash) return;   // identical file to the previous frame
        lastHash = pdf.hash;
        keep.push(i);
      });

      const results = new Array(list.length).fill(null);
      const total = keep.length;
      let done = 0, next = 0;
      setProgress(0, `Rendering CV versions… 0/${total}`);
      const worker = async () => {
        while (next < total) {
          const i = keep[next++];
          try {
            results[i] = await renderFrame(list[i], pdfs[i].bytes, width, label);
          } catch (e) {
            showError(`Could not render ${list[i].branch} @ ${list[i].sha.slice(0, 7)}: ${e.message || e}`);
          }
          done++;
          setProgress(done / total * 0.9, `Rendering CV versions… ${done}/${total}`);
        }
      };
      await Promise.all(Array.from({ length: CONCURRENCY }, worker));
      return { frames: results.filter(Boolean), retryable };
    }

    // ====== Encode the GIF (cheap: re-run when only FPS / hold / loop change) ======
    // GIF delays are stored in 1/100 s, so this is what the file really uses.
    const frameDelayMs = (fps) => Math.round(1000 / fps / 10) * 10;

    async function encodeGif(frames, { fps, holdMs, loop }) {
      const delay = frameDelayMs(fps);
      const gif = GIFEncoder();
      for (let i = 0; i < frames.length; i++) {
        const f = frames[i];
        gif.writeFrame(f.index, f.width, f.height, {
          palette: f.palette,
          delay: i === frames.length - 1 ? delay + holdMs : delay,
          repeat: loop ? 0 : -1,
        });
        if (i % 4 === 3) {
          setProgress(0.9 + (i + 1) / frames.length * 0.1, `Encoding GIF… ${i + 1}/${frames.length}`);
          await new Promise((r) => setTimeout(r));
        }
      }
      gif.finish();
      return new Blob([gif.bytes()], { type: 'image/gif' });
    }

    // ====== UI helpers ======
    function setProgress(fraction, text) {
      progressBar.style.width = `${Math.round(Math.max(0, Math.min(1, fraction)) * 100)}%`;
      if (text) statusEl.textContent = text;
    }
    function showError(msg) {
      const div = document.createElement('div');
      div.className = 'error';
      div.textContent = msg;
      errorsEl.appendChild(div);
    }
    const fmtBytes = (n) => (n > 1048576 ? `${(n / 1048576).toFixed(1)} MB` : `${Math.round(n / 1024)} KB`);
    const renderSettings = () => ({ width: Number(widthSel.value), order: orderSel.value, label: labelChk.checked });
    const keyOf = (s) => `${s.width}|${s.order}|${s.label}`;
    const renderKey = () => keyOf(renderSettings());
    const timingParams = () => ({ fps: parseFloat(fpsInput.value), holdMs: Number(holdSel.value), loop: loopChk.checked });
    const sameTiming = (a, b) => !!a && !!b && a.fps === b.fps && a.holdMs === b.holdMs && a.loop === b.loop;
    const framesUsable = () => !!state.frames && state.framesKey === renderKey();

    function updateFpsText() {
      const fps = parseFloat(fpsInput.value);
      fpsVal.textContent = `${fps} fps`;
      fpsHint.textContent = `${frameDelayMs(fps)} ms per frame`;
    }

    function syncUrl() {
      const p = new URLSearchParams({ fps: fpsInput.value, width: widthSel.value, order: orderSel.value });
      if (!labelChk.checked) p.set('label', '0');
      if (!loopChk.checked) p.set('loop', '0');
      if (holdSel.value !== '1000') p.set('hold', holdSel.value);
      try { history.replaceState(null, '', `${location.pathname}?${p}`); } catch { /* Safari/Firefox rate-limit replaceState */ }
    }
    let urlTimer = null;
    function syncUrlSoon() { clearTimeout(urlTimer); urlTimer = setTimeout(syncUrl, 300); }

    function readUrl() {
      const p = new URLSearchParams(location.search);
      const set = (el, v) => { if (v != null && [...el.options].some((o) => o.value === v)) el.value = v; };
      const fps = parseFloat(p.get('fps'));
      if (fps >= 0.5 && fps <= 20) fpsInput.value = String(Math.round(fps * 2) / 2);
      set(widthSel, p.get('width'));
      set(orderSel, p.get('order'));
      set(holdSel, p.get('hold'));
      if (p.get('label') === '0') labelChk.checked = false;
      if (p.get('loop') === '0') loopChk.checked = false;
    }

    function setBusy(busy) {
      state.busy = busy;
      const ready = state.versions.length > 0;
      generateBtn.disabled = busy || !ready;
      generateBtn.textContent = busy ? 'Working…'
        : !ready ? (state.loadError ? 'Unavailable' : 'Loading…')
        : framesUsable() && !state.incomplete ? 'Regenerate GIF' : 'Generate GIF';
    }

    function showGif(blob, frames, params) {
      if (state.gifUrl) URL.revokeObjectURL(state.gifUrl);
      state.gifUrl = URL.createObjectURL(blob);
      state.gifParams = params;
      state.failedParams = null;
      previewImg.src = state.gifUrl;
      previewImg.style.display = 'block';
      placeholder.style.display = 'none';
      downloadBtn.href = state.gifUrl;
      downloadBtn.download = `cv-timelapse-${params.fps}fps-${frames[0].width}px.gif`;
      downloadBtn.setAttribute('aria-disabled', 'false');
      const seconds = (frames.length * frameDelayMs(params.fps) + params.holdMs) / 1000;
      const first = frames[0].version.date?.slice(0, 10), last = frames[frames.length - 1].version.date?.slice(0, 10);
      metaEl.innerHTML = '';
      for (const text of [`${frames.length} frames`, `${params.fps} fps`, `${seconds.toFixed(1)} s ${params.loop ? 'per loop' : 'long'}`,
                          `${frames[0].width}×${frames[0].height}`, fmtBytes(blob.size),
                          first && last ? `${first} → ${last}` : null].filter(Boolean)) {
        const span = document.createElement('span');
        span.className = 'pill';
        span.textContent = text;
        metaEl.appendChild(span);
      }
    }

    // Timing the preview doesn't show yet, and that hasn't just failed to encode (no retry loop).
    const timingPending = () => {
      const t = timingParams();
      return !sameTiming(t, state.gifParams) && !sameTiming(t, state.failedParams);
    };

    // After any job, point out settings the preview doesn't reflect yet.
    function afterJob() {
      if (!state.frames) return;
      if (!framesUsable()) statusEl.textContent = 'Settings changed: click Generate GIF to apply them.';
      else if (timingPending()) scheduleReencode();
    }

    // ====== Actions ======
    async function generate() {
      if (state.busy || !state.versions.length) return;
      setBusy(true);
      errorsEl.innerHTML = '';
      const render = renderSettings();   // snapshot: controls may change while this runs
      const params = timingParams();
      try {
        if (!state.frames || state.framesKey !== keyOf(render) || state.incomplete) {
          state.frames = null;
          state.framesKey = '';
          const { frames, retryable } = await buildFrames(render);
          if (!frames.length) throw new Error('No CV versions could be rendered.');
          state.frames = frames;
          state.framesKey = keyOf(render);
          state.incomplete = retryable > 0;
        }
        const blob = await encodeGif(state.frames, params);
        showGif(blob, state.frames, params);
        setProgress(1, state.incomplete
          ? `Done with ${state.frames.length} versions; some downloads failed (click Generate GIF to retry them).`
          : `Done: ${state.frames.length} versions, ${fmtBytes(blob.size)}.`);
      } catch (e) {
        state.failedParams = params;
        showError(e.message || String(e));
        setProgress(0, 'Something went wrong; see the message below.');
      } finally {
        setBusy(false);
      }
      afterJob();
    }

    // FPS / hold / loop only change frame timing, so re-encode the cached frames.
    let reencodeTimer = null;
    function scheduleReencode() {
      clearTimeout(reencodeTimer);
      reencodeTimer = setTimeout(reencode, 250);
    }

    async function reencode() {
      if (!framesUsable() || !timingPending()) return;
      if (state.busy) { scheduleReencode(); return; }
      setBusy(true);
      const params = timingParams();
      try {
        const blob = await encodeGif(state.frames, params);
        showGif(blob, state.frames, params);
        setProgress(1, `Updated to ${params.fps} fps (${fmtBytes(blob.size)}).`);
      } catch (e) {
        state.failedParams = params;
        showError(e.message || String(e));
      } finally {
        setBusy(false);
      }
      afterJob();
    }

    function onTimingChange() {
      updateFpsText();
      syncUrlSoon();
      scheduleReencode();
    }

    function onRenderChange() {
      syncUrlSoon();
      setBusy(state.busy);   // refresh the button label
      if (!state.busy) afterJob();
    }

    fpsInput.addEventListener('input', onTimingChange);
    holdSel.addEventListener('change', onTimingChange);
    loopChk.addEventListener('change', onTimingChange);
    widthSel.addEventListener('change', onRenderChange);
    orderSel.addEventListener('change', onRenderChange);
    labelChk.addEventListener('change', onRenderChange);
    generateBtn.addEventListener('click', generate);

    // ====== Boot ======
    (async function init() {
      readUrl();
      updateFpsText();
      try {
        state.versions = await loadVersions();
        if (!state.versions.length) throw new Error(`No commits changed ${FILE_PATH}.`);
        const branches = new Set(state.versions.map((v) => v.branch)).size;
        statusEl.textContent = `Found ${state.versions.length} CV versions across ${branches} branches.`;
      } catch (e) {
        state.versions = [];
        state.loadError = true;
        showError(e.message || String(e));
        statusEl.textContent = 'Could not load the CV history.';
      }
      setBusy(false);
    })();
  </script>
</body>
</html>
